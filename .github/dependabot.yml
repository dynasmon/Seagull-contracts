version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tools/buf
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
    groups:
      modules:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
    groups:
      actions:
        patterns: ["*"]
