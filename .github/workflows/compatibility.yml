name: compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: backward compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: reuse the contract tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .local/bin
          key: contract-tools-${{ runner.os }}-${{ hashFiles('go.mod', 'tools/buf/go.sum') }}
      # A pull request is checked out as the merge GitHub made of it, whose first
      # parent is the main it was made from. main may have moved on since, and a
      # field merged there meanwhile would read as one this change deleted.
      - name: refuse breaking changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            make breaking BASELINE=HEAD^1
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            make breaking
          fi
